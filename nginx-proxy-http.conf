# HTTP-only reverse proxy for leto-meet.exe.xyz
# Use this for local development or testing before setting up SSL

upstream frontend {
    server localhost:3000;
}

upstream backend {
    server localhost:8071;
}

upstream keycloak {
    server localhost:8083;
}

upstream livekit {
    server localhost:7880;
}

# Main HTTP server (no SSL)
server {
    listen 9080;
    listen [::]:9080;
    server_name leto-meet.exe.xyz localhost;

    # Max upload size for recordings
    client_max_body_size 500M;

    # Backend API - /api/*
    location /api/ {
        proxy_pass http://backend/api/;
        proxy_http_version 1.1;

        # Preserve original request info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Keycloak authentication - /auth/*
    location /auth/ {
        proxy_pass http://keycloak/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Keycloak specific headers
        proxy_set_header X-Forwarded-Prefix /auth;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # LiveKit WebRTC server
    location /livekit/ {
        proxy_pass http://livekit/;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # Static files (if served directly by nginx)
    location /static/ {
        alias /data/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /data/media/;
        expires 1y;
        add_header Cache-Control "public";
    }

    # Frontend - everything else goes to the React app
    location / {
        proxy_pass http://frontend/;
        proxy_http_version 1.1;

        # WebSocket support for Vite HMR in development
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoints
    location /__heartbeat__ {
        proxy_pass http://backend/__heartbeat__;
        access_log off;
    }

    location /__lbheartbeat__ {
        proxy_pass http://backend/__lbheartbeat__;
        access_log off;
    }
}
