# Main reverse proxy for leto-meet.exe.xyz
# This config proxies all services under a single domain with path-based routing

upstream frontend {
    server localhost:3000;
}

upstream backend {
    server localhost:8071;
}

upstream keycloak {
    server localhost:8083;
}

upstream livekit {
    server localhost:7880;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name leto-meet.exe.xyz;

    return 301 https://$server_name$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name leto-meet.exe.xyz;

    # SSL Configuration
    # Replace these paths with your actual certificate paths
    ssl_certificate /etc/ssl/certs/leto-meet.exe.xyz.crt;
    ssl_certificate_key /etc/ssl/private/leto-meet.exe.xyz.key;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Max upload size for recordings
    client_max_body_size 500M;

    # Backend API - /api/*
    location /api/ {
        proxy_pass http://backend/api/;
        proxy_http_version 1.1;

        # Preserve original request info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # CORS support
        proxy_set_header Access-Control-Allow-Origin *;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Keycloak authentication - /auth/*
    location /auth/ {
        proxy_pass http://keycloak/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Keycloak specific headers
        proxy_set_header X-Forwarded-Prefix /auth;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # LiveKit WebRTC server
    location /livekit/ {
        proxy_pass http://livekit/;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # Static files (if served directly by nginx)
    location /static/ {
        alias /data/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /data/media/;
        expires 1y;
        add_header Cache-Control "public";
    }

    # Frontend - everything else goes to the React app
    location / {
        proxy_pass http://frontend/;
        proxy_http_version 1.1;

        # WebSocket support for Vite HMR in development
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoints
    location /__heartbeat__ {
        proxy_pass http://backend/__heartbeat__;
        access_log off;
    }

    location /__lbheartbeat__ {
        proxy_pass http://backend/__lbheartbeat__;
        access_log off;
    }
}
